{% if erro %}
<div class="resultado-frete"><span class="descricao">Erro ao calcular o frete: {{ erro }}</span></div>
{% elif valor %}
<div class="resultado-frete">
    <span class="valor">R$ {{ valor|floatformat:2 }}</span>
    <span class="descricao">Frete para os parâmetros informados.</span>
</div>
{% else %}
<div class="resultado-frete"><span class="descricao">Nenhuma faixa encontrada para os valores informados.</span></div>
{% endif %}
