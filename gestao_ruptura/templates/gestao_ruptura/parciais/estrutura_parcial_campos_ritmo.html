{% comment %}
    * [RESUMO] → O campo "Ritmo dos últimos N dias" com os atalhos (7, 15, 30, 60, 90, 120 e 1 ano) — o mesmo na lista e no detalhe. Recebe "pagina". Os atalhos são <button> que o script
      da tela (script_ruptura.js) usa para preencher o campo e refazer o cálculo.
{% endcomment %}<div class="rup-campo rup-campo--ritmo">
    <label class="rup-rotulo" for="rup-dias">Ritmo dos últimos</label>
    <input type="number"
           id="rup-dias"
           name="dias"
           value="{{ pagina.dias_valor }}"
           min="1"
           step="1"
           inputmode="numeric"
           class="rup-input rup-input--num">
    <span class="rup-unidade">dias</span>
    <div class="lista-chips" aria-label="Atalhos de período">
        {% for a in pagina.atalhos %}
            <button type="button"
                    class="lista-chip rup-atalho{% if a.ativo %} lista-chip--ativo{% endif %}"
                    data-dias="{{ a.dias }}">{{ a.rotulo }}</button>
        {% endfor %}
    </div>
</div>
