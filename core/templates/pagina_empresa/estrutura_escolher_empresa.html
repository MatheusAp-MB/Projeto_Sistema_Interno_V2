<!--
* [RESUMO] → Tela de escolher/trocar a empresa ativa. Página
* independente — mesmo padrão da tela de login (sem sidebar/toolbar).
-->
{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolher empresa — Sistema Interno MB/SV</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'pagina_login/css/layout_login.css' %}">
    <link rel="stylesheet" href="{% static 'pagina_empresa/css/layout_empresa.css' %}">
</head>

<body class="login-body">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <img src="{% static 'base_compartilhada/img/logo.jpg' %}" alt="Logo MB/SV">
            </div>
            <h1 class="login-titulo">Qual empresa?</h1>
            <p class="login-subtitulo">Escolha a empresa que você vai usar agora</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="login-erro">
                        <i class="fas fa-exclamation-circle"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <div class="escolha-empresa-lista">
                {% for empresa in empresas %}
                    <form method="post" action="{% url 'escolher_empresa' %}">
                        {% csrf_token %}
                        <input type="hidden" name="empresa" value="{{ empresa.valor }}">
                        <button type="submit" class="btn-escolher-empresa btn-empresa-{{ empresa.valor|lower }}">
                            <i class="fas fa-building"></i>
                            {{ empresa.nome_exibicao }}
                        </button>
                    </form>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
