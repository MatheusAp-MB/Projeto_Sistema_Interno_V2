<!--
* [RESUMO] → Linha do tempo ÚNICA e completa de 1 produto — desde o Vídeo
* Simples até o fim do ciclo, tudo misturado em ordem cronológica (26/07,
* "toda ação feita é rastreada de ponta a ponta"). Reaproveitada pelo modal
* (Formato A) e por cada grupo do relatório geral (Formato B). Recebe
* "historico" (dict de montar_historico_produto — "eventos" já vem
* mesclado e ordenado por historico_postagens.py, nunca ordenar aqui).
-->
{% if historico.aviso_gap %}
<p class="historico-aviso-gap">
    <i class="fas fa-circle-info"></i> {{ historico.aviso_gap }}
</p>
{% endif %}

<div class="historico-lista">
    {% for evento in historico.eventos %}
    <div class="historico-evento historico-evento--{{ evento.tipo }}">
        <div class="historico-evento-corpo">
            <i class="fas {{ evento.icone }} historico-evento-icone"></i>
            <span class="historico-evento-label">{{ evento.label }}</span>
            <span class="historico-evento-data">{{ evento.timestamp|date:"d/m/Y H:i" }}</span>
        </div>
    </div>
    {% empty %}
    <p class="historico-vazio">Nenhuma atividade registrada ainda.</p>
    {% endfor %}
</div>
