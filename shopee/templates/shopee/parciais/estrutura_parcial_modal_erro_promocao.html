<div class="promocao-modal-overlay">
    <div class="promocao-modal">
        <p class="promocao-modal-titulo"><i class="fas fa-exclamation-triangle"></i> Não foi possível gerar a promoção</p>
        {% for erro in erros %}
        <div class="promocao-modal-erro">{{ erro }}</div>
        {% endfor %}
        <button type="button" class="btn-acao promocao-modal-btn" onclick="this.closest('.promocao-modal-overlay').remove()">Entendi</button>
    </div>
</div>
