[tool.poetry]
package-mode = false

[project]
name = "projeto-sistema-interno-mb-vs"
version = "1.0"
description = ""
authors = []
requires-python = ">=3.12"
dependencies = [
    "django (>=6.0.6,<7.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "mkdocs (>=1.6.1,<2.0.0)",
    "mysqlclient (>=2.2.8,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "mkdocs-material (>=9.7.6,<10.0.0)",
    "pymysql (>=1.2.0,<2.0.0)",
    "tabulate (>=0.10.0,<0.11.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "flake8 (>=7.3.0,<8.0.0)"
]
