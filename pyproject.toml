[tool.poetry]
package-mode = false

[project]
name = "projeto-sistema-interno-mb-vs"
version = "1.0"
description = ""
authors = []
requires-python = ">=3.12,<3.16"
dependencies = [
    "django (>=6.0.6,<7.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "mkdocs (>=1.6.1,<2.0.0)",
    "mysqlclient (>=2.2.8,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "mkdocs-material (>=9.7.6,<10.0.0)",
    "pymysql (>=1.2.0,<2.0.0)",
    "tabulate (>=0.10.0,<0.11.0)",
    "python-calamine (>=0.8.2,<0.9.0)",
    "pywinauto (>=0.6.9,<0.7.0)",
    "pywin32 (>=312,<313)",
    "keyboard (>=0.13.5,<0.14.0)",
    "google-api-python-client (>=2.198.0,<3.0.0)",
    "google-auth (>=2.56.2,<3.0.0)",
    "google-auth-httplib2 (>=0.4.0,<0.5.0)",
    "docx (>=0.2.4,<0.3.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "pystray (>=0.19.5,<0.20.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "flask (>=3.1.3,<4.0.0)",
    "flask-cors (>=6.0.5,<7.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "pyinstaller (>=6.21.0,<7.0.0)",
    "pytest-django (>=4.12.0,<5.0.0)",
    "pytest-sugar (>=1.1.1,<2.0.0)"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "projeto_sistema_interno_mb_sv.settings"
python_files = ["tests.py", "test_*.py"]
addopts = "--no-header -ra"