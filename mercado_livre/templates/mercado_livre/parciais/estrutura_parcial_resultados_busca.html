{% if resultados %}
<div class="lista-resultados-busca">
    {% for categoria in resultados %}
    <button type="button" class="item-resultado-busca"
            hx-get="{% url 'mercado_livre_categorias_selecionar' categoria.category_id %}"
            hx-target="#categorias-trilha-niveis"
            hx-swap="innerHTML">
        <span class="nome-resultado-busca">{{ categoria.nome }}</span>
        <span class="caminho-resultado-busca">{{ categoria.caminho_completo }}</span>
    </button>
    {% endfor %}
</div>
{% elif termo %}
<div class="lista-resultados-busca lista-resultados-busca-vazia">Nenhuma categoria encontrada pra "{{ termo }}".</div>
{% endif %}
